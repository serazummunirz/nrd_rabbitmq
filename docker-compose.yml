services:

  rabbitmq:

    image: rabbitmq:4-management

    container_name: nrd-rabbitmq

    restart: unless-stopped

    env_file:
      - .env

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - nrd_rabbitmq_data:/var/lib/rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - discovery


volumes:

  nrd_rabbitmq_data:


networks:

  discovery:
    external: true